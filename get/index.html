<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Track Session Minder</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16325C">
<link rel="icon" href="/img/apple-touch-icon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script>
// The one link for every QR code and printout: tracksessionminder.com/get
// ---- Change these at the App Store launch (nothing else on this page needs to change) ----
var LAUNCHED = false;                 // true = iPhones go to the App Store, Android phones to Google Play
var APP_STORE = '';                   // e.g. https://apps.apple.com/app/id1234567890
var GOOGLE_PLAY = '';                 // e.g. https://play.google.com/store/apps/details?id=com.redlinetechniques.tracksessionminder
var WEB_APP = 'https://kpctoy-png.github.io/Track-Session-Minder-App/'; // After Dec 5: https://app.tracksessionminder.com/
// ------------------------------------------------------------------------------------------
(function () {
  var q = location.search;
  var ua = navigator.userAgent;
  var iphone = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var to = WEB_APP + q;
  // "?web" always opens the web schedule, for anyone who doesn't want the app.
  if (LAUNCHED && !/[?&]web\b/.test(q)) {
    if (iphone && APP_STORE) to = APP_STORE;
    else if (android && GOOGLE_PLAY) to = GOOGLE_PLAY;
    else to = null; // A computer: show the page below with both stores and the web schedule.
  }
  if (to) location.replace(to);
  window.TSM_GET = { web: WEB_APP + q, ios: APP_STORE, android: GOOGLE_PLAY };
})();
</script>
<style>
.get{max-width:460px;margin:40px auto;padding:0 16px;text-align:center}
.get img.logo{width:96px;height:96px;border-radius:22px;border:3px solid var(--navy)}
.get h1{color:var(--navy);font-style:italic;font-weight:900;font-size:30px;margin:14px 0 6px}
.get .btn{display:block;margin:12px 0 0}
.get [hidden]{display:none}
</style>
</head><body>
<div class="get">
  <img class="logo" src="/img/apple-touch-icon.png" alt="Track Session Minder">
  <h1>Track Session Minder</h1>
  <p class="note" id="msg">Opening the live track schedule…</p>
  <a class="btn" id="ios" href="#" hidden>Download on the App Store</a>
  <a class="btn" id="android" href="#" hidden>Get it on Google Play</a>
  <a class="btn alt" id="web" href="https://kpctoy-png.github.io/Track-Session-Minder-App/">Open the schedule in your browser</a>
</div>
<script>
(function () {
  var g = window.TSM_GET; if (!g) return;
  document.getElementById('web').href = g.web;
  if (LAUNCHED) {
    document.getElementById('msg').textContent = 'Get the app for your sessions and alerts, or view the schedule in your browser.';
    if (g.ios) { var a = document.getElementById('ios'); a.href = g.ios; a.hidden = false; }
    if (g.android) { var b = document.getElementById('android'); b.href = g.android; b.hidden = false; }
  }
})();
</script>
</body></html>
